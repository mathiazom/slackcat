# Local dev auth gate (docker-compose.yml's slackopy-gate). quickstart.sh generates
# the production one.
#
# FusionAuth's issuer is http://localhost:9011 for the browser, but "localhost" in
# this container is the container itself, so discovery is skipped and the
# server-side calls go to the compose service instead.
upstreamConfig:
  upstreams:
    - id: files
      path: ^/files/(.*)$
      rewriteTarget: /$1
      uri: http://seaweedfs:8080
    - id: site
      path: /
      uri: file:///site/current/
server:
  BindAddress: 0.0.0.0:4180
providers:
  - id: fusionauth
    provider: oidc
    # Match the pre-seeded "slackopy (dev)" application in fusionauth-kickstart.json
    clientID: 9f13ba2a-6a24-4a19-a1e7-4b3dcb2f0000
    clientSecret: slackopy-dev-secret-change-me
    scope: openid profile offline_access
    loginURL: http://localhost:9011/oauth2/authorize
    redeemURL: http://fusionauth:9011/oauth2/token
    oidcConfig:
      issuerURL: http://localhost:9011
      skipDiscovery: true
      jwksURL: http://fusionauth:9011/.well-known/jwks.json
      # Any user FusionAuth lets in may view; users need no email.
      emailClaim: sub
      insecureAllowUnverifiedEmail: true
      audienceClaims: [aud]
